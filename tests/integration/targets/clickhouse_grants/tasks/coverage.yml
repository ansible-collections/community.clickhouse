---
####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################
# Privileges already covered by existing grants must not be granted again.

- name: Coverage - create test user
  community.clickhouse.clickhouse_user:
    name: cov_user
    password: cov_password
    state: present

# 1. Grant with grant option covers request without it
- name: Coverage 1 - setup grant with grant option
  community.clickhouse.clickhouse_client:
    execute: "GRANT SELECT ON foo.* TO cov_user WITH GRANT OPTION"

- name: Coverage 1 - get grants before
  register: grants_before
  community.clickhouse.clickhouse_client:
    execute: "SHOW GRANTS FOR cov_user"

- name: Coverage 1 - request without grant option in check mode
  register: result
  check_mode: true
  community.clickhouse.clickhouse_grants:
    grantee: cov_user
    privileges:
      - object: 'foo.*'
        privs:
          SELECT: false

- name: Coverage 1 - assert not changed in check mode
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.executed_statements == []

- name: Coverage 1 - request without grant option
  register: result
  community.clickhouse.clickhouse_grants:
    grantee: cov_user
    privileges:
      - object: 'foo.*'
        privs:
          SELECT: false

- name: Coverage 1 - assert not changed
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.executed_statements == []

- name: Coverage 1 - get grants after
  register: grants_after
  community.clickhouse.clickhouse_client:
    execute: "SHOW GRANTS FOR cov_user"

- name: Coverage 1 - assert grants untouched
  ansible.builtin.assert:
    that:
      - grants_after.result == grants_before.result

- name: Coverage 1 - reset grants
  community.clickhouse.clickhouse_client:
    execute: "REVOKE ALL ON *.* FROM cov_user"

# 2. Database grant covers table request
- name: Coverage 2 - setup database grant
  community.clickhouse.clickhouse_client:
