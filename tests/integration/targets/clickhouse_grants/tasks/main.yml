####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################

# Initial CI tests of clickhouse_grants module
- import_tasks: initial.yml

# CI tests for `cluster` parameter
- import_tasks: cluster.yml

# CI tests for `revokes` parameter
- name: Get server version
  register: server_info
  community.clickhouse.clickhouse_info:
    limit: version

- name: Set whether single element objects are supported
  set_fact:
    objects_supported: "{{ (server_info['version']['year'] | int == 25 and server_info['version']['feature'] | int >= 8)
                                   or server_info['version']['year'] | int > 25 }}"

- name: Test partial revokes
  import_tasks: partial_revokes.yml

- name: Test supported objects in newer version
  import_tasks: objects.yml
  when: objects_supported
